<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>용산 장소 검색 데모</title>
  <style>
    :root { color-scheme: light; --ink:#17202a; --muted:#718096; --line:#e7ebf0; --primary:#3267e3; --soft:#f4f7ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f6f8fb; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
    .shell { width:min(920px, calc(100% - 32px)); margin:48px auto 80px; }
    .eyebrow { color:var(--primary); font-weight:700; font-size:13px; letter-spacing:.04em; }
    h1 { margin:10px 0 8px; font-size:32px; letter-spacing:-.04em; }
    .intro { margin:0 0 28px; color:var(--muted); line-height:1.65; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:20px; padding:22px; box-shadow:0 10px 30px rgba(33,45,65,.05); }
    .fixed-location { display:flex; align-items:center; gap:10px; padding:13px 15px; margin-bottom:18px; background:var(--soft); border-radius:12px; color:#274797; font-weight:700; }
    .pin { font-size:18px; }
    .form { display:grid; grid-template-columns:1fr 170px auto; gap:10px; }
    input, select, button { border:1px solid #d9e0ea; border-radius:11px; min-height:46px; font:inherit; }
    input, select { padding:0 14px; color:var(--ink); background:#fff; }
    input:focus, select:focus { outline:3px solid rgba(50,103,227,.14); border-color:var(--primary); }
    button { padding:0 20px; background:var(--primary); color:#fff; border-color:var(--primary); font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .hint { margin:11px 0 0; color:var(--muted); font-size:13px; }
    .status { min-height:24px; margin:24px 2px 12px; color:var(--muted); font-size:14px; }
    .status.error { color:#c53030; }
    .summary { display:flex; justify-content:space-between; align-items:end; margin:0 2px 12px; }
    .summary strong { font-size:19px; }
    .results { display:grid; gap:12px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; display:grid; grid-template-columns:1fr auto; gap:12px; }
    .card h2 { margin:0 0 8px; font-size:17px; letter-spacing:-.02em; }
    .category { display:inline-block; padding:4px 8px; margin-bottom:10px; border-radius:6px; background:#f1f4f8; color:#566273; font-size:12px; }
    .address { margin:4px 0; color:#4a5568; font-size:14px; line-height:1.5; }
    .distance { align-self:start; color:var(--primary); font-size:13px; font-weight:700; white-space:nowrap; }
    .link { display:inline-block; margin-top:9px; color:var(--primary); font-size:13px; text-decoration:none; }
    .link:hover { text-decoration:underline; }
    .raw-toggle { display:inline-flex; align-items:center; gap:4px; margin:9px 0 0 12px; padding:0; border:0; background:transparent; color:#68758a; min-height:auto; font-size:13px; font-weight:500; cursor:pointer; }
    .raw-toggle:hover { color:var(--primary); }
    .raw-toggle .arrow { display:inline-block; transition:transform .15s ease; }
    .raw-toggle.open .arrow { transform:rotate(90deg); }
    .raw-json { display:none; margin:14px 0 0; padding:14px; max-height:280px; overflow:auto; border-radius:10px; background:#17202a; color:#d9e4f5; font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; word-break:break-word; }
    .raw-json.open { display:block; }
    .empty { padding:42px 18px; text-align:center; border:1px dashed #cfd7e3; border-radius:16px; background:#fff; color:var(--muted); }
    @media (max-width:650px) { .shell { margin-top:28px; } h1 { font-size:27px; } .form { grid-template-columns:1fr 1fr; } .form button { grid-column:1 / -1; } .card { grid-template-columns:1fr; } .distance { justify-self:start; } }
  </style>
</head>
<body>
<main class="shell">
  <div class="eyebrow">COURSE PLACE SEARCH DEMO</div>
  <h1>용산 주변 장소 검색</h1>
  <p class="intro">용산을 검색 중심지로 고정하고, 키워드와 반경에 따른 카카오 장소 검색 결과를 확인하는 테스트 페이지입니다.</p>

  <section class="panel">
    <div class="fixed-location"><span class="pin">📍</span><span>서울 용산구 · 중심 좌표 37.5326, 126.9905</span></div>
    <form id="searchForm" class="form">
      <input id="query" name="query" type="search" value="입력" placeholder="예: 카페, 공방, 쇼핑" autocomplete="off" required />
      <select id="type" name="type" aria-label="장소 유형">
        <option value="ACTIVITY">활동</option>
        <option value="RESTAURANT">음식점</option>
        <option value="CAFE">카페</option>
      </select>
      <button id="submit" type="submit">검색하기</button>
    </form>
    <div class="form" style="margin-top:10px; grid-template-columns:170px 1fr;">
      <select id="radius" aria-label="검색 반경">
        <option value="500">반경 500m</option>
        <option value="1000">반경 1km</option>
        <option value="3000" selected>반경 3km</option>
        <option value="5000">반경 5km</option>
        <option value="10000">반경 10km</option>
      </select>
      <div class="hint">카카오 API의 최대 검색 반경은 20km입니다.</div>
    </div>
  </section>

  <div id="status" class="status">키워드를 입력하고 검색해보세요.</div>
  <div id="summary" class="summary" hidden><strong>검색 결과</strong><span id="count"></span></div>
  <section id="results" class="results"></section>
</main>
<script>
  const form = document.querySelector('#searchForm');
  const queryInput = document.querySelector('#query');
  const typeInput = document.querySelector('#type');
  const radiusInput = document.querySelector('#radius');
  const button = document.querySelector('#submit');
  const status = document.querySelector('#status');
  const results = document.querySelector('#results');
  const summary = document.querySelector('#summary');
  const count = document.querySelector('#count');
  const searchCenter = { latitude: '37.5326', longitude: '126.9905' };

  // 주소에 query/type/radius가 붙어 있으면 협업자가 공유한 검색 화면을
  // 열자마자 같은 조건으로 다시 조회한다.
  const initialParams = new URLSearchParams(window.location.search);
  const initialQuery = initialParams.get('query');
  if (initialQuery) {
    queryInput.value = initialQuery;
    if ([...typeInput.options].some((option) => option.value === initialParams.get('type'))) {
      typeInput.value = initialParams.get('type');
    }
    if ([...radiusInput.options].some((option) => option.value === initialParams.get('radius'))) {
      radiusInput.value = initialParams.get('radius');
    }
    // 이 스크립트가 body 마지막에 실행될 때는 DOMContentLoaded가
    // 이미 지나간 브라우저도 있으므로, 이벤트 대신 다음 tick에서 실행한다.
    setTimeout(() => form.requestSubmit(), 0);
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const query = queryInput.value.trim();
    if (!query) return;
    const shareParams = new URLSearchParams({ query, type: typeInput.value, radius: radiusInput.value });
    history.replaceState(null, '', `${window.location.pathname}?${shareParams}`);
    setLoading(true);
    status.className = 'status';
    status.textContent = '카카오에서 장소를 검색하고 있습니다...';
    summary.hidden = true;
    results.replaceChildren();
    const params = new URLSearchParams({ query, type: typeInput.value, latitude: searchCenter.latitude, longitude: searchCenter.longitude, radius: radiusInput.value, size: '15' });
    try {
      const response = await fetch(`/api/places/candidates?${params}`);
      if (!response.ok) {
        let message = `검색에 실패했습니다. HTTP ${response.status}`;
        try {
          const body = await response.json();
          if (body.code && body.message) message = `${body.code}: ${body.message}`;
          else if (body.message) message = body.message;
        } catch (_) { /* non-json error */ }
        throw new Error(message);
      }
      const places = await response.json();
      render(places);
    } catch (error) {
      status.className = 'status error';
      status.textContent = `${error.message} 서버 실행 상태와 KAKAO_REST_API_KEY 환경변수를 확인해주세요.`;
    } finally { setLoading(false); }
  });

  function render(places) {
    summary.hidden = false;
    count.textContent = `${places.length}개`;
    if (!places.length) {
      status.textContent = '검색 결과가 없습니다. 키워드나 반경을 바꿔보세요.';
      results.innerHTML = '<div class="empty">조건에 맞는 장소를 찾지 못했습니다.</div>';
      return;
    }
    status.textContent = '용산 중심 좌표에서 가까운 순서로 표시했습니다.';
    places.forEach((place) => {
      const card = document.createElement('article');
      card.className = 'card';
      const distance = Number.isFinite(place.distanceMeters) ? `${place.distanceMeters.toLocaleString()}m` : '거리 정보 없음';
      const content = document.createElement('div');
      content.innerHTML = `<span class="category">${escapeHtml(place.categoryName || '카테고리 미제공')}</span><h2>${escapeHtml(place.name || '이름 없음')}</h2><p class="address">${escapeHtml(place.roadAddressName || place.addressName || '주소 미제공')}</p>${place.placeUrl ? `<a class="link" href="${escapeAttr(place.placeUrl)}" target="_blank" rel="noopener noreferrer">카카오맵에서 보기 ↗</a>` : ''}<button type="button" class="raw-toggle"><span class="arrow">▶</span> 원본 JSON 보기</button><pre class="raw-json"></pre>`;
      const rawToggle = content.querySelector('.raw-toggle');
      const rawJson = content.querySelector('.raw-json');
      rawJson.textContent = JSON.stringify(place.rawDocument || {}, null, 2);
      rawToggle.addEventListener('click', () => {
        const isOpen = rawJson.classList.toggle('open');
        rawToggle.classList.toggle('open', isOpen);
        rawToggle.querySelector('.arrow').textContent = isOpen ? '▼' : '▶';
        rawToggle.lastChild.textContent = isOpen ? ' 원본 JSON 닫기' : ' 원본 JSON 보기';
      });
      card.append(content, Object.assign(document.createElement('div'), { className: 'distance', textContent: distance }));
      results.appendChild(card);
    });
  }
  function setLoading(loading) { button.disabled = loading; button.textContent = loading ? '검색 중...' : '검색하기'; }
  function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char])); }
  function escapeAttr(value) { return escapeHtml(value); }
</script>
</body>
</html>
