<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지역 추천 테스트</title>
  <style>
    :root { color-scheme: light; --ink:#182230; --muted:#667085; --line:#e4e7ec; --blue:#2563eb; --paper:#fff; --soft:#f8fafc; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--soft); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
    main { width:min(1080px,calc(100% - 32px)); margin:40px auto 72px; }
    h1 { margin:0 0 8px; font-size:28px; letter-spacing:-.04em; }
    p { margin:0; color:var(--muted); line-height:1.55; }
    .panel { margin-top:24px; padding:22px; border:1px solid var(--line); border-radius:14px; background:var(--paper); }
    .fields { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    label.field { display:grid; gap:7px; font-size:13px; font-weight:650; }
    select,button { min-height:40px; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); font:inherit; }
    .tags-title { display:flex; justify-content:space-between; gap:12px; margin:22px 0 10px; font-size:14px; font-weight:700; }
    .muted { color:var(--muted); font-size:12px; font-weight:400; }
    .tags { display:flex; flex-wrap:wrap; gap:8px; }
    .tag { display:inline-flex; align-items:center; gap:7px; padding:8px 10px; border:1px solid var(--line); border-radius:999px; cursor:pointer; font-size:13px; }
    .tag:has(input:checked) { border-color:#84adff; background:#eff6ff; color:#1849a9; }
    .tag input { accent-color:var(--blue); }
    .actions { display:flex; align-items:center; gap:12px; margin-top:20px; }
    button { border-color:var(--blue); background:var(--blue); color:white; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    #status { color:var(--muted); font-size:13px; }
    .results-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:30px 0 12px; }
    .results-head h2 { margin:0; font-size:20px; }
    .results { display:grid; gap:12px; }
    .area { padding:18px 20px; border:1px solid var(--line); border-radius:12px; background:var(--paper); }
    .area-top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
    .rank { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:#eff6ff; color:#1849a9; font-weight:800; }
    .area h3 { margin:0; font-size:18px; }
    .area-id { margin-left:auto; color:var(--muted); font-size:12px; }
    .matched { display:grid; gap:10px; }
    .matched-tag { padding:12px; border-radius:9px; background:#f8fafc; }
    .matched-tag h4 { margin:0 0 8px; font-size:14px; }
    .detail { margin-top:6px; font-size:13px; line-height:1.5; }
    .detail strong { color:#344054; }
    .empty,.error { padding:24px; border:1px dashed var(--line); border-radius:12px; color:var(--muted); text-align:center; }
    .error { border-color:#fda29b; background:#fff6f5; color:#b42318; }
    [hidden] { display:none !important; }
    @media(max-width:680px) { main { margin-top:24px; } .fields { grid-template-columns:1fr; } .panel { padding:16px; } }
  </style>
</head>
<body>
<main>
  <h1>지역 추천 테스트</h1>
  <p>추천 입력을 보내고 API가 반환한 Area 후보를 순위대로 전부 확인합니다. 결과 개수는 화면에서 자르지 않습니다.</p>
  <section class="panel" aria-label="추천 조건">
    <div class="fields">
      <label class="field">도시<select id="city"></select></label>
      <label class="field">동행자<select id="companion"></select></label>
      <label class="field">시간대<select id="time"></select></label>
    </div>
    <div class="tags-title"><span>원하는 태그</span><span id="tag-count" class="muted">0 / 15 선택</span></div>
    <div id="tags" class="tags"></div>
    <div class="actions"><button id="submit" type="button" disabled>지역 추천 요청</button><span id="status" role="status">선택지를 불러오는 중...</span></div>
  </section>
  <div class="results-head"><h2>추천 결과</h2><span id="result-count" class="muted"></span></div>
  <section id="results" class="results" aria-live="polite"></section>
</main>
<script>
  const citySelect = document.querySelector('#city');
  const companionSelect = document.querySelector('#companion');
  const timeSelect = document.querySelector('#time');
  const tagsRoot = document.querySelector('#tags');
  const submitButton = document.querySelector('#submit');
  const status = document.querySelector('#status');
  const resultsRoot = document.querySelector('#results');
  const resultCount = document.querySelector('#result-count');
  const tagCount = document.querySelector('#tag-count');
  const MAX_TAGS = 15;

  async function loadOptions() {
    try {
      const response = await fetch('api/v1/recommendations/options');
      const options = await readResponse(response);
      fillSelect(citySelect, options.cities, option => option.name, option => option.id);
      fillSelect(companionSelect, options.companionTypes, option => option.name, option => option.code);
      fillSelect(timeSelect, options.timeSlots, option => option.name, option => option.code);
      for (const tag of options.tags) {
        const label = document.createElement('label');
        label.className = 'tag';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = tag.code;
        checkbox.addEventListener('change', updateTagCount);
        const name = document.createElement('span');
        name.textContent = tag.name;
        label.append(checkbox, name);
        tagsRoot.append(label);
      }
      submitButton.disabled = false;
      status.textContent = '조건을 선택하고 요청하세요.';
    } catch (error) {
      status.textContent = error.message;
      status.className = 'error';
    }
  }

  function fillSelect(select, values, getLabel, getValue) {
    select.replaceChildren();
    for (const item of values ?? []) {
      const option = document.createElement('option');
      option.value = getValue(item);
      option.textContent = getLabel(item);
      select.append(option);
    }
  }

  function updateTagCount() {
    const checked = [...tagsRoot.querySelectorAll('input:checked')];
    tagCount.textContent = `${checked.length} / ${MAX_TAGS} 선택`;
    for (const checkbox of tagsRoot.querySelectorAll('input:not(:checked)')) {
      checkbox.disabled = checked.length >= MAX_TAGS;
    }
  }

  async function readResponse(response) {
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.message || `요청 실패 (${response.status})`);
    return body;
  }

  async function recommend() {
    submitButton.disabled = true;
    status.className = '';
    status.textContent = '추천 요청 중...';
    resultsRoot.replaceChildren();
    resultCount.textContent = '';
    const request = {
      cityId: Number(citySelect.value),
      companionType: companionSelect.value,
      timeSlot: timeSelect.value,
      tagCodes: [...tagsRoot.querySelectorAll('input:checked')].map(input => input.value)
    };
    try {
      const response = await fetch('api/v1/recommendations/area', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(request)
      });
      render(await readResponse(response));
      status.textContent = '추천이 완료됐습니다.';
    } catch (error) {
      status.textContent = error.message;
      status.className = 'error';
    } finally {
      submitButton.disabled = false;
    }
  }

  function render(data) {
    const areas = data.areas ?? [];
    resultCount.textContent = `총 ${areas.length}개`;
    if (!areas.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '추천 결과가 없습니다. 다른 태그 조합으로 다시 시도해보세요.';
      resultsRoot.append(empty);
      return;
    }
    areas.forEach((area, index) => {
      const card = document.createElement('article');
      card.className = 'area';
      const top = document.createElement('div');
      top.className = 'area-top';
      const rank = document.createElement('span');
      rank.className = 'rank';
      rank.textContent = index + 1;
      const name = document.createElement('h3');
      name.textContent = area.areaName;
      const id = document.createElement('span');
      id.className = 'area-id';
      id.textContent = `Area ID ${area.areaId}`;
      top.append(rank, name, id);
      card.append(top);
      const matchedTags = document.createElement('div');
      matchedTags.className = 'matched';
      for (const tag of area.areaTags ?? []) matchedTags.append(tagCard(tag));
      card.append(matchedTags);
      resultsRoot.append(card);
    });
  }

  function tagCard(tag) {
    const section = document.createElement('section');
    section.className = 'matched-tag';
    const title = document.createElement('h4');
    title.textContent = tag.tagName;
    section.append(title);
    appendDetail(section, '추천 방문 지역', tag.recommendedVisitPlaces);
    appendDetail(section, '매력', tag.attractionFeatures);
    appendDetail(section, '차별점', tag.differentiators);
    return section;
  }

  function appendDetail(parent, label, values) {
    if (!values?.length) return;
    const line = document.createElement('p');
    line.className = 'detail';
    const heading = document.createElement('strong');
    heading.textContent = `${label}: `;
    const content = document.createElement('span');
    content.textContent = values.join(' · ');
    line.append(heading, content);
    parent.append(line);
  }

  submitButton.addEventListener('click', recommend);
  loadOptions();
</script>
</body>
</html>
